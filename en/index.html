/* Layout: a lavender desk. Gallery = a shelf of colouring pages; studio = the page in the middle,
   tools on one side, a case of marker caps (or stickers) on the other (stacked top/bottom in portrait).
   Everything Lara touches is at least 60 px. */
:root {
  --desk: #d8ccf3;
  --desk-deep: #c7b6ef;
  --panel: #fdfbff;
  --ink: #2c2340;
  --ink-soft: #645a80;
  --pink: #ff7fa8;
  --butter: #ffdf7e;
  --mint: #93dcc2;
  --grey: #e6e1ee;
  --on-accent: #2c2340;
  --shade: rgba(64, 44, 120, .22);
  --scrim: rgba(36, 24, 64, .45);
  --paper: #ffffff;
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #241c38; --desk-deep: #1a1429; --panel: #352b52; --ink: #f4efff; --ink-soft: #bcb0dc;
    --pink: #ff8fb4; --butter: #ffd86e; --mint: #7fd1b4; --grey: #4a4066; --on-accent: #2c2340;
    --shade: rgba(0, 0, 0, .4); --scrim: rgba(8, 4, 18, .6); --paper: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #241c38; --desk-deep: #1a1429; --panel: #352b52; --ink: #f4efff; --ink-soft: #bcb0dc;
  --pink: #ff8fb4; --butter: #ffd86e; --mint: #7fd1b4; --grey: #4a4066; --on-accent: #2c2340;
  --shade: rgba(0, 0, 0, .4); --scrim: rgba(8, 4, 18, .6); --paper: #ffffff; color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--desk); color: var(--ink); font: 16px/1.4 var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;

<script>
// Drawing helpers shared by every scene. Coordinates live in an 800 x 800 viewBox.
// The renderer wraps each scene in:
//   <g fill="#fff" stroke="#1d1d1d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
// so every shape is a white, outlined, colourable area unless told otherwise.
// Later shapes cover earlier ones (painter's order), which is how areas get split.

const INK = '#1d1d1d';
const SCENES = [];

const n2 = v => Math.round(v * 100) / 100;

function attrs(a) {
  if (!a) return '';
  if (typeof a === 'string') return ' ' + a;
  return Object.entries(a).map(([k, v]) => ` ${k}="${v}"`).join('');
}

// ---------- primitives ----------
function circle(cx, cy, r, a) { return `<circle cx="${n2(cx)}" cy="${n2(cy)}" r="${n2(r)}"${attrs(a)}/>`; }
function ellipse(cx, cy, rx, ry, a) { return `<ellipse cx="${n2(cx)}" cy="${n2(cy)}" rx="${n2(rx)}" ry="${n2(ry)}"${attrs(a)}/>`; }
function rect(x, y, w, h, rx = 0, a) { return `<rect x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${n2(h)}" rx="${n2(rx)}"${attrs(a)}/>`; }
function path(d, a) { return `<path d="${d}"${attrs(a)}/>`; }
function poly(points, a) { return `<polygon points="${points.map(p => n2(p[0]) + ',' + n2(p[1])).join(' ')}"${attrs(a)}/>`; }
// An open line that never fills (use for details that should NOT split an area).
function line(d, sw = 5) { return `<path d="${d}" fill="none" stroke-width="${sw}"/>`; }
function g(content, transform) { return `<g transform="${transform}">${content}</g>`; }

// ---------- union outline ----------
// Draws several closed shapes as ONE merged outline (no inner lines).
// shapes: [{c:[cx,cy,r]}, {e:[cx,cy,rx,ry]}, {r:[x,y,w,h,rx]}, {d:'path data'}]
function union(shapes, sw = 7) {
  const one = (s, a) => s.c ? circle(...s.c, a) : s.e ? ellipse(...s.e, a) : s.r ? rect(...s.r, a) : path(s.d, a);
  const outer = shapes.map(s => one(s, { 'stroke-width': sw * 2 })).join('');
  const inner = shapes.map(s => one(s, { stroke: 'none' })).join('');
  return outer + inner;
}

// A thick outlined band along any path (tails, straws, handles, rainbow bands, scarves).
// w = width of the white inside. Closed end-to-end with round caps.
function tube(d, w, sw = 7) {
  return path(d, { fill: 'none', 'stroke-width': w + 2 * sw }) + path(d, { fill: 'none', stroke: '#fff', 'stroke-width': w });
}

// ---------- kawaii face ----------
function eye(x, y, s = 1) {
  return ellipse(x, y, 7.5 * s, 9 * s, { fill: INK, stroke: 'none' }) +
         circle(x + 2.4 * s, y - 3.4 * s, 2.6 * s, { fill: '#fff', stroke: 'none' });
}
function happyEye(x, y, s = 1) { return line(`M${n2(x - 8 * s)} ${n2(y + 3 * s)} Q${n2(x)} ${n2(y - 9 * s)} ${n2(x + 8 * s)} ${n2(y + 3 * s)}`, 5); }
function sleepyEye(x, y, s = 1) { return line(`M${n2(x - 8 * s)} ${n2(y - 2 * s)} Q${n2(x)} ${n2(y + 8 * s)} ${n2(x + 8 * s)} ${n2(y - 2 * s)}`, 5); }
function blush(x, y, s = 1) { return ellipse(x, y, 11 * s, 6.5 * s, { 'stroke-width': 4 }); }
function mouth(x, y, s = 1, type = 'smile') {
  if (type === 'none') return '';
  if (type === 'w') return line(`M${n2(x - 9 * s)} ${n2(y - 2 * s)} Q${n2(x - 4.5 * s)} ${n2(y + 6 * s)} ${n2(x)} ${n2(y - 1 * s)} Q${n2(x + 4.5 * s)} ${n2(y + 6 * s)} ${n2(x + 9 * s)} ${n2(y - 2 * s)}`, 4.5);
  if (type === 'open') return path(`M${n2(x - 8 * s)} ${n2(y - 2 * s)} Q${n2(x)} ${n2(y + 15 * s)} ${n2(x + 8 * s)} ${n2(y - 2 * s)} Z`, { 'stroke-width': 4.5 });
  if (type === 'o') return ellipse(x, y + 2 * s, 4.5 * s, 5.5 * s, { 'stroke-width': 4.5 });
  return line(`M${n2(x - 6 * s)} ${n2(y - 1 * s)} Q${n2(x)} ${n2(y + 6 * s)} ${n2(x + 6 * s)} ${n2(y - 1 * s)}`, 4.5);
}
// face(cx, cy, s, { eyes:'open'|'happy'|'sleep', mouth:'smile'|'w'|'open'|'o'|'none', blush:true, spread:26 })
function face(cx, cy, s = 1, o = {}) {
  const sp = (o.spread ?? 26) * s;
  const ey = o.eyes || 'open';
  const E = ey === 'happy' ? happyEye : ey === 'sleep' ? sleepyEye : eye;
  let out = '';
  if (o.blush !== false) out += blush(cx - sp - 13 * s, cy + 13 * s, s) + blush(cx + sp + 13 * s, cy + 13 * s, s);
  out += E(cx - sp, cy, s) + E(cx + sp, cy, s);
  out += mouth(cx, cy + 9 * s, s, o.mouth || 'smile');

}

// ---------- decorations ----------
function heart(cx, cy, size, a) {
  const s = size / 2;
  return path(`M${n2(cx)} ${n2(cy + s * 0.95)} C${n2(cx - s * 1.7)} ${n2(cy - s * 0.05)} ${n2(cx - s * 0.75)} ${n2(cy - s * 1.35)} ${n2(cx)} ${n2(cy - s * 0.5)} C${n2(cx + s * 0.75)} ${n2(cy - s * 1.35)} ${n2(cx + s * 1.7)} ${n2(cy - s * 0.05)} ${n2(cx)} ${n2(cy + s * 0.95)} Z`, a);
}
function star(cx, cy, R, r = R * 0.5, n = 5, rot = -90, a) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const ang = (rot + i * 180 / n) * Math.PI / 180;
    const rad = i % 2 ? r : R;
    pts.push([cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad]);

}

  const k = s * 0.2;
  return path(`M${n2(cx)} ${n2(cy - s)} Q${n2(cx + k)} ${n2(cy - k)} ${n2(cx + s)} ${n2(cy)} Q${n2(cx + k)} ${n2(cy + k)} ${n2(cx)} ${n2(cy + s)} Q${n2(cx - k)} ${n2(cy + k)} ${n2(cx - s)} ${n2(cy)} Q${n2(cx - k)} ${n2(cy - k)} ${n2(cx)} ${n2(cy - s)} Z`, a ?? { 'stroke-width': 5 });

  let out = '';
  for (let i = 0; i < petals; i++) {
    const ang = (rot + i * 360 / petals) * Math.PI / 180;
    out += circle(cx + Math.cos(ang) * r * 0.58, cy + Math.sin(ang) * r * 0.58, r * 0.5, { 'stroke-width': 5 });

  const b = h * 0.5;

    { r: [cx - w / 2, cy, w, b, b / 2] },
    { c: [cx - w * 0.25, cy + b * 0.3, h * 0.42] },
    { c: [cx + w * 0.02, cy - h * 0.02, h * 0.58] },
    { c: [cx + w * 0.27, cy + b * 0.35, h * 0.4] },
  ], sw);
}
// Leaf pointing along `angle` degrees from (x, y). The midrib does not split the leaf.
function leaf(x, y, len, wid, angle = 0) {
  return g(path(`M0 0 Q${n2(len * 0.5)} ${n2(-wid)} ${n2(len)} 0 Q${n2(len * 0.5)} ${n2(wid)} 0 0 Z`, { 'stroke-width': 6 }) +
           line(`M${n2(len * 0.15)} 0 Q${n2(len * 0.5)} ${n2(-wid * 0.12)} ${n2(len * 0.78)} 0`, 4),
           `translate(${n2(x)} ${n2(y)}) rotate(${n2(angle)})`);
}
function steam(x, y, h = 60) {
  const q = h / 4;
  return line(`M${n2(x)} ${n2(y)} q${n2(-q)} ${n2(-q)} 0 ${n2(-2 * q)} t0 ${n2(-2 * q)}`, 5);
}

// Turns a scene's line art into colourable areas.
// rasterize() draws the SVG at SIZE px; analyze() labels every closed white area,
// grows each label a few px under the lines (no white halos), and builds the ink overlay.

const Core = (() => {
  const SIZE = 1600;     // working resolution (viewBox 800 -> 2x)
  const WALL = 150;      // luminance below this is a line
  const MIN_AREA = 170;  // smaller areas (eye highlights, specks) stay white and locked
  const GROW = 3;        // px painted under the lines

  function wrap(body, size = SIZE) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 800 800">` +
      `<g fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
  }
  function svgUrl(body, size) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wrap(body, size)); }

  function loadImage(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Obrázok sa nepodarilo načítať'));
      img.src = src;
    });
  }

  let scratch = null;
  async function rasterize(body) {
    const img = await loadImage(svgUrl(body, SIZE));
    if (!scratch) { scratch = document.createElement('canvas'); scratch.width = scratch.height = SIZE; }
    const x = scratch.getContext('2d', { willReadFrequently: true });
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = '#fff'; x.fillRect(0, 0, SIZE, SIZE);
    x.drawImage(img, 0, 0, SIZE, SIZE);
    return x.getImageData(0, 0, SIZE, SIZE);
  }

  function analyze(imgData) {
    const W = imgData.width, H = imgData.height, N = W * H, d = imgData.data;
    const lum = new Uint8Array(N);
    for (let i = 0, j = 0; i < N; i++, j += 4) lum[i] = (d[j] * 77 + d[j + 1] * 151 + d[j + 2] * 28) >> 8;

    // 1. connected white areas (4-connected)
    const label = new Int32Array(N);
    const stack = new Int32Array(N);
    const regions = [null];
    let id = 0;
    for (let p = 0; p < N; p++) {
      if (label[p] || lum[p] < WALL) continue;
      id++;
      let sp = 0, area = 0, x0 = W, y0 = H, x1 = 0, y1 = 0;
      stack[sp++] = p; label[p] = id;
      while (sp) {
        const q = stack[--sp];
        const y = (q / W) | 0, x = q - y * W;
        area++;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        let r;
        if (x > 0 && !label[r = q - 1] && lum[r] >= WALL) { label[r] = id; stack[sp++] = r; }
        if (x < W - 1 && !label[r = q + 1] && lum[r] >= WALL) { label[r] = id; stack[sp++] = r; }
        if (y > 0 && !label[r = q - W] && lum[r] >= WALL) { label[r] = id; stack[sp++] = r; }
        if (y < H - 1 && !label[r = q + W] && lum[r] >= WALL) { label[r] = id; stack[sp++] = r; }
      }
      regions.push({ id, area, x0, y0, x1, y1, locked: area < MIN_AREA });
    }

    // 2. grow colourable areas a few px under the lines
    const grow = new Int32Array(N);
    for (let p = 0; p < N; p++) { const v = label[p]; grow[p] = v && regions[v].locked ? -v : v; }
    let prev = new Int32Array(N);
    for (let it = 0; it < GROW; it++) {
      prev.set(grow);
      for (let y = 0; y < H; y++) {
        const row = y * W;
        for (let x = 0; x < W; x++) {
          const p = row + x;
          if (prev[p]) continue;
          let v = 0;
          if (x > 0 && prev[p - 1] > 0) v = prev[p - 1];
          else if (x < W - 1 && prev[p + 1] > 0) v = prev[p + 1];
          else if (y > 0 && prev[p - W] > 0) v = prev[p - W];
          else if (y < H - 1 && prev[p + W] > 0) v = prev[p + W];
          if (v) grow[p] = v;
        }
      }
    }
    prev = null;
    for (let i = 1; i < regions.length; i++) {
      const r = regions[i];
      r.x0 = Math.max(0, r.x0 - GROW); r.y0 = Math.max(0, r.y0 - GROW);
      r.x1 = Math.min(W - 1, r.x1 + GROW); r.y1 = Math.min(H - 1, r.y1 + GROW);
    }

    // 3. ink overlay: lines keep their anti-aliasing, locked specks stay white
    const overlay = new ImageData(W, H);
    const o = overlay.data;
    for (let i = 0, j = 0; i < N; i++, j += 4) {
      const v = label[i];
      if (v && regions[v].locked) { o[j] = o[j + 1] = o[j + 2] = 255; o[j + 3] = 255; continue; }
      o[j] = 29; o[j + 1] = 27; o[j + 2] = 32;
      o[j + 3] = 255 - lum[i];
    }
    return { W, H, label, grow, regions, overlay };
  }

  // Alpha mask (white, opaque where the area is) cropped to the area's box.
  function regionMask(a, id) {
    const r = a.regions[id];
    const w = r.x1 - r.x0 + 1, h = r.y1 - r.y0 + 1;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    const im = x.createImageData(w, h), m = im.data;
    for (let yy = 0; yy < h; yy++) {
      let p = (r.y0 + yy) * a.W + r.x0, j = yy * w * 4;
      for (let xx = 0; xx < w; xx++, p++, j += 4) {
        if (a.grow[p] === id) { m[j] = m[j + 1] = m[j + 2] = 255; m[j + 3] = 255; }
      }
    }
    x.putImageData(im, 0, 0);
    return { canvas: c, x: r.x0, y: r.y0, w, h };
  }

  // Area under a point; if the finger lands on a line, take the nearest area.
  function regionAt(a, px, py, reach = 14) {
    px = Math.round(px); py = Math.round(py);
    const ok = (x, y) => x >= 0 && y >= 0 && x < a.W && y < a.H;
    if (ok(px, py) && a.grow[py * a.W + px] > 0) return a.grow[py * a.W + px];
    for (let r = 1; r <= reach; r++) {
      for (let dy = -r; dy <= r; dy++) {
        const edge = Math.abs(dy) === r;
        for (let dx = -r; dx <= r; dx += edge ? 1 : 2 * r) {
          const x = px + dx, y = py + dy;
          if (ok(x, y)) { const v = a.grow[y * a.W + x]; if (v > 0) return v; }
        }
      }
    }
    return 0;
  }

  return { SIZE, MIN_AREA, wrap, svgUrl, loadImage, rasterize, analyze, regionMask, regionAt };
})();

// point on a quadratic curve
function aQ(p0, p1, p2, t) {
  const u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
}
// bunting garland: flags hang along a quadratic string
function aBunting(p0, p1, p2, n, fl = 46, fw = 42) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const [x, y] = aQ(p0, p1, p2, t);
    const dx = 2 * (1 - t) * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    const dy = 2 * (1 - t) * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    s += g(poly([[-fw / 2, 0], [fw / 2, 0], [0, fl]], { 'stroke-width': 6 }), `translate(${n2(x)} ${n2(y)}) rotate(${n2(ang)})`);
  }
  s += line(`M${p0[0]} ${p0[1]} Q${p1[0]} ${p1[1]} ${p2[0]} ${p2[1]}`, 6);
  s += circle(p0[0], p0[1], 7, { fill: INK, stroke: 'none' }) + circle(p2[0], p2[1], 7, { fill: INK, stroke: 'none' });

}

// croissant: crescent (outer arc R, inner shallow arc) split into 5 segments by radial lines
function aCroissant(x, y, rot = 0, R = 62, T = 38, span = 100) {
  const rad = d => d * Math.PI / 180;
  const tx = R * Math.sin(rad(span)), ty = -R * Math.cos(rad(span)), y0 = -R + T;
  const k = (y0 * y0 - tx * tx - ty * ty) / (2 * (y0 - ty)), r2 = k - y0;
  let s = path(`M${n2(-tx)} ${n2(ty)} A${R} ${R} 0 ${span > 90 ? 1 : 0} 1 ${n2(tx)} ${n2(ty)} A${n2(r2)} ${n2(r2)} 0 0 0 ${n2(-tx)} ${n2(ty)} Z`);
  [-46, -18, 18, 46].forEach(a => {
    const c = Math.cos(rad(a)), sn = Math.sin(rad(a));
    const t = -c * k + Math.sqrt(c * c * k * k - k * k + r2 * r2);
    s += line(`M${n2(R * sn)} ${n2(-R * c)} L${n2(t * sn)} ${n2(-t * c)}`, 5);
  });
  return g(s, `translate(${x} ${y + R * 0.6}) rotate(${rot})`);
}
// cupcake standing on by
function aCupcake(x, by, w = 66, lines = true) {
  let s = poly([[x - w / 2, by - 50], [x + w / 2, by - 50], [x + w / 2 - 9, by], [x - w / 2 + 9, by]]);
  if (lines) s += line(`M${n2(x - w / 6)} ${by - 50} L${n2(x - w / 8)} ${by}`, 5) + line(`M${n2(x + w / 6)} ${by - 50} L${n2(x + w / 8)} ${by}`, 5);
  s += union([{ c: [x - w * 0.3, by - 56, w * 0.27] }, { c: [x + w * 0.3, by - 56, w * 0.27] }, { c: [x, by - 70, w * 0.34] }, { c: [x, by - 92, w * 0.2] }]);

  return s;
}

<script>
// Zvieratká: seven cozy kawaii animal colouring pages.
(() => {
const bInk = { fill: INK, stroke: 'none' };
const bW = w => ({ 'stroke-width': w });
const bP = (x, y) => `${n2(x)} ${n2(y)}`;

function bToward(p, q, d) { const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy); return [p[0] + dx / L * d, p[1] + dy / L * d]; }
function bScale(pts, o, k) { return pts.map(p => [o[0] + (p[0] - o[0]) * k, o[1] + (p[1] - o[1]) * k]); }
// y of an ellipse at x (sign -1 = upper half, +1 = lower half)
function bEy(cx, cy, rx, ry, x, sign = 1) { const u = (x - cx) / rx; return cy + sign * ry * Math.sqrt(Math.max(0, 1 - u * u)); }
// triangle with a rounded tip (ears)
function bEar(a, b, c, r = 16, attr) {
  const t1 = bToward(b, a, r), t2 = bToward(b, c, r);
  return path(`M${bP(...a)} L${bP(...t1)} Q${bP(...b)} ${bP(...t2)} L${bP(...c)} Z`, attr);
}
// row of U-shaped drips from x0 (right) to x1 (left) hanging below the baseline yAt(x)
function bDripPath(x0, x1, yAt, deps) {
  let d = '', xa = x0, ya = yAt(x0);
  const n = deps.length;
  for (let i = 0; i < n; i++) {
    const xb = x0 + (x1 - x0) * (i + 1) / n, yb = yAt(xb);
    const k = Math.max(ya, yb) + deps[i] * 1.33;
    d += ` C${bP(xa, k)} ${bP(xb, k)} ${bP(xb, yb)}`;
    xa = xb; ya = yb;
  }
  return d;
}
// icing that covers an ellipse top and drips down its front
function bIcing(cx, cy, rx, ry, base, deps, attr) {
  const d = `M${bP(cx - rx, cy)} A${rx} ${ry} 0 0 1 ${bP(cx + rx, cy)} L${bP(cx + rx, cy + base)}` +
    bDripPath(cx + rx, cx - rx, x => bEy(cx, cy, rx, ry, x) + base, deps) + ' Z';
  return path(d, attr);
}
function bDrop(cx, cy, h, attr) {
  const w = h * 0.4;
  return path(`M${bP(cx, cy - h * 0.55)} C${bP(cx + w * 0.35, cy - h * 0.3)} ${bP(cx + w, cy - h * 0.05)} ${bP(cx + w, cy + h * 0.17)} ` +
    `C${bP(cx + w, cy + h * 0.38)} ${bP(cx + w * 0.55, cy + h * 0.45)} ${bP(cx, cy + h * 0.45)} ` +
    `C${bP(cx - w * 0.55, cy + h * 0.45)} ${bP(cx - w, cy + h * 0.38)} ${bP(cx - w, cy + h * 0.17)} ` +
    `C${bP(cx - w, cy - h * 0.05)} ${bP(cx - w * 0.35, cy - h * 0.3)} ${bP(cx, cy - h * 0.55)} Z`, attr ?? bW(6));
}
function bCookie(cx, cy, r, rot = 0) {

         ` C${bP(cx + 0.75 * s, cy - 1.35 * s)} ${bP(cx + 1.7 * s, cy - 0.05 * s)} ${bP(cx, cy + 0.95 * s)}`;
}
function bSpiral(cx, cy, r0, turns, a0 = 135) {
  let d = '';

}

// Category "mnamky" (yummy food): cozy kawaii food pages.
(() => {
const cR = v => Math.round(v * 100) / 100;
const cP = p => cR(p[0]) + ' ' + cR(p[1]);
const cTr = (x, y, r = 0, sc = 1) => `translate(${cR(x)} ${cR(y)})` + (r ? ` rotate(${cR(r)})` : '') + (sc !== 1 ? ` scale(${sc})` : '');
const cInk = { fill: INK, stroke: 'none' };

// Smooth path through points (Catmull-Rom -> cubic Bezier).
function cSmooth(pts, closed = true) {
  const n = pts.length;
  let d = 'M' + cP(pts[0]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(0, i - 1)];
    const p1 = pts[i], p2 = pts[(i + 1) % n];
    const p3 = pts[closed ? (i + 2) % n : Math.min(n - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${cP(c1)} ${cP(c2)} ${cP(p2)}`;
  }
  return d + (closed ? ' Z' : '');
}

// Part of the infinite line A + t*D that lies inside convex polygon P.
function cClip(ax, ay, dx, dy, P) {
  const ts = [];
  for (let i = 0; i < P.length; i++) {
    const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
    const ex = x2 - x1, ey = y2 - y1, den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-9) continue;
    const qx = x1 - ax, qy = y1 - ay;
    const t = (qx * ey - qy * ex) / den, s = (qx * dy - qy * dx) / den;
    if (s >= -1e-9 && s <= 1 + 1e-9) ts.push(t);
  }
  if (ts.length < 2) return null;
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  return [[ax + t0 * dx, ay + t0 * dy], [ax + t1 * dx, ay + t1 * dy]];
}

function cBez(a, b, c, d, t) {
  const u = 1 - t;
  return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0],
          u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]];
}

// Polygon with rounded corners.
function cRound(pts, r) {
  const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
    const p1 = [p[0] + (a[0] - p[0]) * ra / la, p[1] + (a[1] - p[1]) * ra / la];
    const p2 = [p[0] + (b[0] - p[0]) * rb / lb, p[1] + (b[1] - p[1]) * rb / lb];
    d += (i ? ' L' : 'M') + cP(p1) + ' Q' + cP(p) + ' ' + cP(p2);
  }
  return d + ' Z';
}

// Convex polygon shrunk inwards by dist.
function cInset(pts, dist) {
  const n = pts.length; let A = 0;
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; A += p[0] * q[1] - q[0] * p[1]; }
  const sg = A > 0 ? 1 : -1;
  const L = pts.map((p, i) => {
    const q = pts[(i + 1) % n], ex = q[0] - p[0], ey = q[1] - p[1], l = Math.hypot(ex, ey);
    return [p[0] - ey / l * sg * dist, p[1] + ex / l * sg * dist, ex, ey];

    const l1 = L[(i - 1 + n) % n];
    const den = l1[2] * l2[3] - l1[3] * l2[2];
    const t = ((l2[0] - l1[0]) * l2[3] - (l2[1] - l1[1]) * l2[2]) / den;
    return [l1[0] + l1[2] * t, l1[1] + l1[3] * t];
  });
}

// Waffle cone: outline, a rim band on top and a big diamond grid below it.
// The grid spacing/angle is searched so that no grid crossing lands close to the
// cone outline (that would make tiny slivers). Returns rim junctions for drips.
function cCone(x, y0, w, h) {
  const tipY = y0 + h, hwt = 11, hw0 = w / 2, yr = y0 + 50;
  const hwAt = y => hwt + (hw0 - hwt) * (tipY - y) / h;

    return Math.hypot(p[0] - a[0] - t * vx, p[1] - a[1] - t * vy);

      }

    for (const sg of segs) for (const e of sg.s) {
      const dTip = tipY - e[1];
      sc = Math.min(sc, dTip < 0.5 ? 0 : dTip - 12);
      for (const c of Q) { const dc = Math.hypot(e[0] - c[0], e[1] - c[1]); if (dc > 1.5) sc = Math.min(sc, dc); }

    for (const a of A) for (const b of B) {
      const den = a.d[0] * b.d[1] - a.d[1] * b.d[0];
      const t = ((b.p[0] - a.p[0]) * b.d[1] - (b.p[1] - a.p[1]) * b.d[0]) / den;
      const n = [a.p[0] + a.d[0] * t, a.p[1] + a.d[1] * t];

      sc = Math.min(sc, dr < 1.5 ? ds : Math.min(dr, ds));

}

// Front-facing donut: dough disc, wavy icing with side drips, hole, face.
// o: { ph, drips: [[angleDeg, amp]], off (x offset of hole+face) }
function cDonut(cx, cy, R, o) {
  let s = circle(cx, cy, R);
  const pts = [];
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2, sn = Math.sin(a);
    let r = R - 42 + 4 * Math.sin(a * 8 + (o.ph || 0)) + (sn > 0 ? 26 * sn * sn : 0);
    (o.drips || []).forEach(([da, amp]) => {
      let q = a - da * Math.PI / 180; q = Math.atan2(Math.sin(q), Math.cos(q));
      r += amp * Math.exp(-q * q / 0.02);
    });
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  s += path(cSmooth(pts));
  s += circle(cx, cy - 6, 27);
  return s;
}
// item placed at angle th (deg) and distance rho from the donut centre
const cAt = (cx, cy, rho, th) => [cx + rho * Math.cos(th * Math.PI / 180), cy + rho * Math.sin(th * Math.PI / 180)];

<script>
// Category "priroda": unicorn, under the sea, space, garden, sleeping fox, dinosaur, hot-air balloon.
(() => {
// ---------- small geometry toolkit (prefixed d) ----------
const dN = v => Math.round(v * 10) / 10;

// Sample an absolute SVG path (M L H V Q C Z) into points.
function dPts(d, step = 1.5) {
  const t = d.match(/[A-Za-z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g);
  const out = [];
  let i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]);
  const push = (f, len) => { const n = Math.max(2, Math.ceil(len / step)); for (let k = 1; k <= n; k++) out.push(f(k / n)); };
  while (i < t.length) {
    if (/[A-Za-z]/.test(t[i])) cmd = t[i++];

<script>
// Čarovné: six magical fairy-tale colouring pages (castle, princess, fairy, mermaid, dragon, tea party).
(() => {
const eInk = { fill: INK, stroke: 'none' };
const eW = w => ({ 'stroke-width': w });
const eP = (x, y) => `${n2(x)} ${n2(y)}`;
const eLerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

// cone roof with a curved band line across it (splits roof into two areas)
function eCone(cx, by, hw, ay, t = 0.38) {
  let s = path(`M${eP(cx - hw, by)} L${eP(cx, ay)} L${eP(cx + hw, by)} Q${eP(cx, by + 24)} ${eP(cx - hw, by)} Z`);
  const L = eLerp([cx - hw, by], [cx, ay], t), R = eLerp([cx + hw, by], [cx, ay], t);
  s += line(`M${eP(...L)} Q${eP(cx, L[1] + 22)} ${eP(...R)}`, 6);
  return s;
}
function eFlag(x, y, dir = 1) {
  return line(`M${x} ${y} V${y - 54}`, 6) + path(`M${eP(x, y - 54)} L${eP(x + dir * 46, y - 40)} L${eP(x, y - 24)} Z`, eW(5));
}
function eArch(cx, top, w, h, a) {
  const r = w / 2;
  return path(`M${eP(cx - r, top + h)} V${n2(top + r)} A${r} ${r} 0 0 1 ${eP(cx + r, top + r)} V${n2(top + h)} Z`, a ?? eW(6));
}
function eCloudFace(cx, cy, w, h) {
  return cloud(cx, cy, w, h) + face(cx, cy + 12, 0.8, { eyes: 'sleep', spread: 20 });
}
// kawaii bangs over a head circle (cx, cy, r)
function eBangs(cx, cy, r, a) {

}
function eBow(cx, cy, k = 1, rot = 0) {
  return g(path('M0 0 L-36 -24 Q-48 -28 -48 -14 L-48 14 Q-48 28 -36 24 Z', eW(6)) +
           path('M0 0 L36 -24 Q48 -28 48 -14 L48 14 Q48 28 36 24 Z', eW(6)) + circle(0, 0, 13, eW(6)),
           `translate(${cx} ${cy}) rotate(${rot}) scale(${k})`);

// sitting kitten, origin = body centre
function eKitten(x, y, k = 1, flip = 1) {

// cubic bezier helpers
function eBez(P, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]];

// Ročné obdobia: five cozy kawaii seasonal colouring pages.
(() => {
const fInk = { fill: INK, stroke: 'none' };
const fW = w => ({ 'stroke-width': w });
const fP = (x, y) => `${n2(x)} ${n2(y)}`;

function fToward(p, q, d) { const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy); return [p[0] + dx / L * d, p[1] + dy / L * d]; }
// triangle with a rounded tip (ears)
function fEar(a, b, c, r = 16, attr) {
  const t1 = fToward(b, a, r), t2 = fToward(b, c, r);
  return path(`M${fP(...a)} L${fP(...t1)} Q${fP(...b)} ${fP(...t2)} L${fP(...c)} Z`, attr);
}
// path data of an ellipse rotated by deg
function fEll(cx, cy, rx, ry, deg = 0) {
  const a = deg * Math.PI / 180, ux = Math.cos(a) * rx, uy = Math.sin(a) * rx;
  return `M${fP(cx - ux, cy - uy)} A${n2(rx)} ${n2(ry)} ${n2(deg)} 1 1 ${fP(cx + ux, cy + uy)} A${n2(rx)} ${n2(ry)} ${n2(deg)} 1 1 ${fP(cx - ux, cy - uy)} Z`;
}
// half width of an axis-aligned ellipse at height y
function fHalf(cy, rx, ry, y) { const v = (y - cy) / ry; return rx * Math.sqrt(Math.max(0, 1 - v * v)); }
// line across an ellipse (ends on the outline); zig > 0 makes a zigzag
function fAcross(cx, cy, rx, ry, y, zig = 0, n = 6, sw = 5) {
  const h = fHalf(cy, rx, ry, y), x0 = cx - h, x1 = cx + h;
  let d = `M${fP(x0, y)}`;
  if (!zig) d += ` L${fP(x1, y)}`;
  else for (let i = 1; i <= n; i++) d += ` L${fP(x0 + (x1 - x0) * i / n, i === n ? y : y + (i % 2 ? -zig : zig))}`;
  return line(d, sw);
}
function fQ(p0, p1, p2, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }
// chubby christmas-tree tier with a scalloped bottom
function fTierPts(cx, top, bot, w) { return { a: [cx, top], c: [cx + w * 0.2, top + (bot - top) * 0.55], b: [cx + w / 2, bot] }; }
function fTier(cx, top, bot, w, bumps = 4, attr) {
  const { a, c, b } = fTierPts(cx, top, bot, w);
  let d = `M${fP(...a)} Q${fP(...c)} ${fP(...b)}`;
  for (let i = 0; i < bumps; i++) {
    const xa = b[0] - w * i / bumps, xb = b[0] - w * (i + 1) / bumps;
    d += ` Q${fP((xa + xb) / 2, bot + 30)} ${fP(xb, bot)}`;

}
function fSnowflake(cx, cy, R) {
  const sh = [];
  for (let i = 0; i < 3; i++) {
    const a = (i * 60 + 90) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), hw = 7, L = R * 0.8;
    const pts = [[L, hw], [-L, hw], [-L, -hw], [L, -hw]].map(([u, v]) => [cx + u * ca - v * sa, cy + u * sa + v * ca]);
    sh.push({ d: 'M' + pts.map(p => fP(...p)).join(' L') + ' Z' });
  }
  for (let i = 0; i < 6; i++) { const a = (i * 60 + 90) * Math.PI / 180; sh.push({ c: [cx + Math.cos(a) * R * 0.8, cy + Math.sin(a) * R * 0.8, R * 0.22] }); }
  sh.push({ c: [cx, cy, R * 0.32] });
  return union(sh, 6);
}
function fBow(cx, cy, k = 1, rot = 0) {
  return g(path('M0 0 L-36 -24 Q-48 -28 -48 -14 L-48 14 Q-48 28 -36 24 Z', fW(6)) +
           path('M0 0 L36 -24 Q48 -28 48 -14 L48 14 Q48 28 36 24 Z', fW(6)) + circle(0, 0, 13, fW(6)),
           `translate(${cx} ${cy}) rotate(${rot}) scale(${k})`);
}
function fTulip(cx, hy, by, k = 1, flip = 1) {
  let s = line(`M${fP(cx, hy + 20)} Q${fP(cx - 6 * flip, (hy + by) / 2)} ${fP(cx, by)}`, 6);
  s += leaf(cx - 3 * flip, by - 85, 64 * k, 22 * k, flip > 0 ? -35 : -145);

         `translate(${cx} ${hy}) scale(${k})`);
  return s;
}
function fMaple(x, y, k = 1, rot = 0) {
  const sh = [{ c: [0, 0, 28] }];
  [[-90, 44, 24, 46], [-30, 38, 20, 40], [-150, 38, 20, 40], [35, 30, 16, 30], [145, 30, 16, 30]].forEach(([a, d, rx, ry]) => {
    const r = a * Math.PI / 180;
    sh.push({ d: fEll(Math.cos(r) * d, Math.sin(r) * d, ry, rx, a) });
  });
  let s = tube('M0 20 Q4 50 -6 70', 6, 6) + union(sh, 6);

  return g(s, `translate(${x} ${y}) rotate(${rot}) scale(${k})`);
}
function fAcorn(x, y, k = 1, rot = 0) {

}
function fShroom(cx, by, w, h) {

<script>
// Dubaj: five cozy kawaii holiday-postcard pages (Burj Khalifa, camel, Burj Al Arab, Ain Dubai, falcon).
(() => {
const gInk = { fill: INK, stroke: 'none' };
const gW = w => ({ 'stroke-width': w });
const gP = (x, y) => `${n2(x)} ${n2(y)}`;

// smiling sun with rounded triangle rays
function gSun(cx, cy, r, n = 8, rot = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (rot + i * 360 / n) * Math.PI / 180, hw = 0.24;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
    s += poly([p(a - hw, r - 6), p(a, r + 36), p(a + hw, r - 6)], gW(6));
  }
  s += circle(cx, cy, r);
  s += face(cx, cy + 2, r / 62, { spread: 22 });
  return s;
}
function gCloud(cx, cy, w, h) { return cloud(cx, cy, w, h) + face(cx, cy + 10, 0.75, { eyes: 'sleep', spread: 18 }); }
function gGull(x, y, k = 1) {
  return line(`M${gP(x - 22 * k, y)} Q${gP(x - 11 * k, y - 14 * k)} ${gP(x, y)} Q${gP(x + 11 * k, y - 14 * k)} ${gP(x + 22 * k, y)}`, 5);
}
// band of scallop waves from y down to the bottom edge
function gWaves(y, n = 8, amp = 22, x0 = 12, x1 = 788) {
  let d = `M${gP(x0, y)}`;
  for (let i = 0; i < n; i++) {
    const a = x0 + (x1 - x0) * i / n, b = x0 + (x1 - x0) * (i + 1) / n;
    d += ` Q${gP((a + b) / 2, y - amp)} ${gP(b, y)}`;
  }
  return path(d + ` L${gP(x1, 788)} L${gP(x0, 788)} Z`);
}
// quadratic / cubic helpers
function gQ(P, t) { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; }
function gQD(P, t) { const u = 1 - t; return [2 * u * (P[1][0] - P[0][0]) + 2 * t * (P[2][0] - P[1][0]), 2 * u * (P[1][1] - P[0][1]) + 2 * t * (P[2][1] - P[1][1])]; }
function gC(P, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]];
}
// point on a cubic whose y grows with t, at height y
function gCatY(P, y) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (gC(P, m)[1] < y) lo = m; else hi = m; }
  return gC(P, (lo + hi) / 2);
}
// point on a quadratic whose y grows with t, at height y
function gQatY(P, y) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (gQ(P, m)[1] < y) lo = m; else hi = m; }
  return gQ(P, (lo + hi) / 2);
}
// tapering band along a quadratic, cut into separate closed sections
function gBand(P, w0, w1, cuts) {
  const at = t => {
    const c = gQ(P, t), d = gQD(P, t), L = Math.hypot(d[0], d[1]), w = (w0 + (w1 - w0) * t) / 2;
    const nx = -d[1] / L, ny = d[0] / L;
    return [[c[0] + nx * w, c[1] + ny * w], [c[0] - nx * w, c[1] - ny * w]];
  };
  let s = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i], b = cuts[i + 1], N = 10, L = [], R = [];
    for (let j = 0; j <= N; j++) { const q = at(a + (b - a) * j / N); L.push(q[0]); R.push(q[1]); }
    s += path('M' + L.map(p => gP(...p)).join(' L') + ' L' + R.reverse().map(p => gP(...p)).join(' L') + ' Z', gW(6));
  }
  return s;
}
// palm tree: trunk from (x, by) to crown (tx, ty)
function gPalm(x, by, tx, ty, k = 1, angles = [-170, -128, -90, -52, -10], cuts = [0, 0.25, 0.5, 0.75, 1]) {
  let s = gBand([[x, by], [x + (tx - x) * 0.15, (by + ty) / 2], [tx, ty]], 40 * k, 28 * k, cuts);
  const L = 100 * k, W = 36 * k;
  angles.forEach(a => {
    const flip = Math.cos(a * Math.PI / 180) < -0.01 ? -1 : 1;
    s += g(path(`M0 0 Q${n2(L * 0.45)} ${n2(-W)} ${n2(L)} ${n2(W * 0.4)} Q${n2(L * 0.5)} ${n2(W * 0.5)} 0 0 Z`, gW(6)),
           `translate(${n2(tx)} ${n2(ty)}) rotate(${a}) scale(1 ${flip})`);
  });
  s += circle(tx - 13 * k, ty + 18 * k, 15 * k, gW(6)) + circle(tx + 13 * k, ty + 18 * k, 15 * k, gW(6));
  s += circle(tx, ty, 18 * k, gW(6));
  return s;
}
// a small dhow-like sailboat with a face; (x, y) = middle of the deck
function gBoat(x, y, k = 1, withFace = true) {
  let b = line('M0 10 V-150', 7);

  b += path('M-86 0 L86 0 Q72 54 36 56 L-36 56 Q-72 54 -86 0 Z');
  if (withFace) b += face(0, 24, 0.8, { spread: 20 });
  return g(b, `translate(${x} ${y}) scale(${k})`);
}

<script>
// Svet: famous landmarks as cozy kawaii postcards (Eiffel Tower, Big Ben, Colosseum, Pisa,
// Neuschwanstein, Bratislava Castle with the UFO bridge, Tower Bridge). Faithful silhouettes, big areas.
(() => {
const iInk = { fill: INK, stroke: 'none' };
const iW = w => ({ 'stroke-width': w });
const iP = (x, y) => `${n2(x)} ${n2(y)}`;
const iPath = pts => 'M' + pts.map(p => iP(p[0], p[1])).join(' L') + ' Z';
const iOpen = pts => 'M' + pts.map(p => iP(p[0], p[1])).join(' L');

// smiling sun with rounded triangle rays
function iSun(cx, cy, r, n = 8, rot = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (rot + i * 360 / n) * Math.PI / 180, hw = 0.24;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
    s += poly([p(a - hw, r - 6), p(a, r + 34), p(a + hw, r - 6)], iW(6));
  }
  return s + circle(cx, cy, r) + face(cx, cy + 2, r / 62, { spread: 22 });
}
function iCloud(cx, cy, w, h) { return cloud(cx, cy, w, h) + face(cx, cy + 10, 0.75, { eyes: 'sleep', spread: 18 }); }
function iGull(x, y, k = 1) {
  return line(`M${iP(x - 22 * k, y)} Q${iP(x - 11 * k, y - 14 * k)} ${iP(x, y)} Q${iP(x + 11 * k, y - 14 * k)} ${iP(x + 22 * k, y)}`, 5);
}
// band of scallop waves from y down to the bottom edge
function iWaves(y, n = 8, amp = 14, x0 = 12, x1 = 788) {
  let d = `M${iP(x0, y)}`;
  for (let i = 0; i < n; i++) {
    const a = x0 + (x1 - x0) * i / n, b = x0 + (x1 - x0) * (i + 1) / n;
    d += ` Q${iP((a + b) / 2, y - amp)} ${iP(b, y)}`;
  }
  return path(d + ` L${iP(x1, 788)} L${iP(x0, 788)} Z`);
}
// round-topped arch: bottom yb, top of the arc yt, width w
function iArch(cx, yb, yt, w, a) {
  const r = w / 2;
  return path(`M${iP(cx - r, yb)} V${n2(yt + r)} A${n2(r)} ${n2(r)} 0 0 1 ${iP(cx + r, yt + r)} V${n2(yb)} Z`, a ?? iW(6));
}
// pointed Gothic lancet: bottom yb, tip yt, width w
function iLancet(cx, yb, yt, w, a) {
  const x0 = cx - w / 2, x1 = cx + w / 2, k = yt + w * 0.75;
  return path(`M${iP(x0, yb)} V${n2(k)} Q${iP(x0, yt + w * 0.12)} ${iP(cx, yt)} Q${iP(x1, yt + w * 0.12)} ${iP(x1, k)} V${n2(yb)} Z`, a ?? iW(6));
}
function iQ(P, t) { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; }
// point on a quadratic whose x is monotonic, at x
function iQatX(P, x) {
  let lo = 0, hi = 1; const dec = P[2][0] < P[0][0];
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if ((iQ(P, m)[0] > x) === dec) lo = m; else hi = m; }
  return iQ(P, (lo + hi) / 2);
}
// round tree: (x, by) = foot of the trunk
function iTree(x, by, r) {
  return rect(x - 13, by - r * 1.2, 26, r * 1.2, 6) +
    union([{ c: [x, by - r * 1.55, r * 0.75] }, { c: [x - r * 0.62, by - r * 1.08, r * 0.58] }, { c: [x + r * 0.62, by - r * 1.08, r * 0.58] }]);
}
// Italian cypress (tall flame)
function iCypress(x, by, h, w) {
  return rect(x - 9, by - 30, 18, 32, 4) +
    path(`M${iP(x, by - 22)} C${iP(x - w * 0.75, by - 26)} ${iP(x - w * 0.55, by - h * 0.6)} ${iP(x, by - h)} C${iP(x + w * 0.55, by - h * 0.6)} ${iP(x + w * 0.75, by - 26)} ${iP(x, by - 22)} Z`);
}
// Roman umbrella pine
function iPine(x, by, h, w) {
  return tube(`M${iP(x, by)} Q${iP(x + 16, by - h * 0.5)} ${iP(x - 4, by - h)}`, 18) +
    union([{ e: [x - 4, by - h - 16, w * 0.5, 38] }, { e: [x - 4 - w * 0.3, by - h + 6, w * 0.3, 28] }, { e: [x - 4 + w * 0.3, by - h + 6, w * 0.3, 28] }]);
}
// fir tree with two tiers
function iFir(x, by, h, w, trunk = true) {
  return (trunk ? rect(x - 9, by - 20, 18, 22, 3) : '') +
    poly([[x - w / 2, by - 16], [x + w / 2, by - 16], [x, by - h * 0.64]]) +
    poly([[x - w * 0.37, by - h * 0.44], [x + w * 0.37, by - h * 0.44], [x, by - h]]);
}
// kawaii pigeon, (x, y) = middle of its body, feet at y + 52k
function iPigeon(x, y, k = 1, flip = false) {
  let p = '';
  p += line('M-12 26 L-14 50 M-24 52 L-4 52', 5) + line('M12 26 L12 50 M2 52 L22 52', 5);
  p += path('M-36 -6 L-84 -20 L-78 6 L-40 16 Z');
  p += ellipse(0, 0, 48, 36);
  p += path('M-32 -2 Q0 -22 24 2 Q-4 24 -32 -2 Z', iW(5));

  p += path('M54 -40 L72 -31 L54 -24 Z', iW(5));
  p += eye(38, -38, 0.8) + blush(32, -21, 0.55);
  return g(p, `translate(${n2(x)} ${n2(y)}) scale(${flip ? -k : k} ${k})`);
}
// sitting kitten facing us, (x, y) = bottom of the paws
function iCat(x, y, k = 1) {
  let c = '';
  c += tube('M44 -30 Q94 -30 90 -76 Q88 -100 68 -96', 22);
  c += ellipse(0, -48, 58, 46);
  c += poly([[-46, -112], [-42, -164], [-6, -138]]) + poly([[46, -112], [42, -164], [6, -138]]);
  c += ellipse(0, -112, 56, 46);
  c += face(0, -114, 0.85, { mouth: 'w', spread: 20 });
  c += ellipse(-24, -8, 18, 11) + ellipse(24, -8, 18, 11);
  return g(c, `translate(${n2(x)} ${n2(y)}) scale(${k})`);
}
// little river cruise boat with a face, (x, y) = middle of the deck
function iShip(x, y, k = 1, chimney = true) {

  if (chimney) b += rect(-12, -82, 26, 36, 5);
  b += rect(-66, -50, 116, 54, 14);
  b += circle(-38, -24, 11, iW(5)) + circle(-8, -24, 11, iW(5)) + circle(22, -24, 11, iW(5));
  b += path('M-96 0 L96 0 Q86 44 54 48 L-62 48 Q-90 44 -96 0 Z');
  b += face(0, 20, 0.8, { spread: 20 });
  return g(b, `translate(${n2(x)} ${n2(y)}) scale(${k})`);
}

// 1 ---------------------------------------------------------------- Eiffel Tower

    const hOut = t => { const a = Math.acos(Math.max(-1, Math.min(1, Math.cos(t)))); return a <= K0 ? 0 : a >= K1 ? 300 : (a - K0) / (K1 - K0) * 300; };
    const tAt = h => K0 + h / 300 * (K1 - K0), am = tAt(HI);
    const seg = (t0, t1, h, a = A, b = B) => {
      const n = Math.max(6, Math.round(Math.abs(t1 - t0) * 60)), pts = [];
      for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; pts.push(P(t, typeof h === 'function' ? h(t) : h, a, b)); }
      return pts;
    };

    s += path(iPath(seg(am, K1, hOut).concat(seg(K1, TAU - K1, 300), seg(TAU - K1, TAU - am, hOut), seg(TAU - am, TAU, HI, A2, B2), seg(0, am, HI, A2, B2))));
    s += ellipse(cx - 50, cy - 245, 200, 64);

<script>
// Svet: seven faithful kawaii landmark pages from around the world.
(() => {
const jW = w => ({ 'stroke-width': w });
const jP = (x, y) => `${n2(x)} ${n2(y)}`;

// smiling sun with rounded triangle rays
function jSun(cx, cy, r, n = 8, rot = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (rot + i * 360 / n) * Math.PI / 180, hw = 0.24;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
    s += poly([p(a - hw, r - 6), p(a, r + 34), p(a + hw, r - 6)], jW(6));
  }
  s += circle(cx, cy, r);
  s += face(cx, cy + 2, r / 62, { spread: 22 });
  return s;
}
function jCloud(cx, cy, w, h, eyes = 'sleep') { return cloud(cx, cy, w, h) + face(cx, cy + 10, 0.75, { eyes, spread: 18 }); }
function jGull(x, y, k = 1) {
  return line(`M${jP(x - 22 * k, y)} Q${jP(x - 11 * k, y - 14 * k)} ${jP(x, y)} Q${jP(x + 11 * k, y - 14 * k)} ${jP(x + 22 * k, y)}`, 5);
}
// band of scallop waves from y down to the bottom edge
function jWaves(y, n = 8, amp = 22, x0 = 12, x1 = 788) {
  let d = `M${jP(x0, y)}`;
  for (let i = 0; i < n; i++) {
    const a = x0 + (x1 - x0) * i / n, b = x0 + (x1 - x0) * (i + 1) / n;
    d += ` Q${jP((a + b) / 2, y - amp)} ${jP(b, y)}`;

// Svet: famous landmarks of the world as cozy kawaii postcard pages

function kSun(cx, cy, r, n = 8, rot = 0, L = 36) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (rot + i * 360 / n) * Math.PI / 180, hw = 0.24;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];

// band of scallop waves from y down to the bottom edge
function kWaves(y, n = 8, amp = 22, x0 = 12, x1 = 788, y1 = 788) {
  let d = `M${kP(x0, y)}`;
  for (let i = 0; i < n; i++) {
    const a = x0 + (x1 - x0) * i / n, b = x0 + (x1 - x0) * (i + 1) / n;

  }
  return path(d + ` L${kP(x1, y1)} L${kP(x0, y1)} Z`);
}
// Catmull-Rom spline through points, sampled densely
function kSpline(pts, n = 16) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {

}

function kYat(sp, x) {

}

// crenellated wall band along a crest polyline xs (x from left to right)
function kWall(crest, x0, x1, o) {
  const N = 90, base = [];
  for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N; base.push([x, kYat(crest, x) + o.lift]); }
  // arc length
  const S = [0];
  for (let i = 1; i < base.length; i++) S.push(S[i - 1] + Math.hypot(base[i][0] - base[i - 1][0], base[i][1] - base[i - 1][1]));
  const L = S[S.length - 1];
  const at = s => {
    let i = 1; while (i < S.length - 1 && S[i] < s) i++;
    const t = (s - S[i - 1]) / (S[i] - S[i - 1] || 1);
    return [base[i - 1][0] + (base[i][0] - base[i - 1][0]) * t, base[i - 1][1] + (base[i][1] - base[i - 1][1]) * t];
  };
  const lerp = (a, b, s) => a + (b - a) * s / L;
  const top = [];
  let s = 0, merlon = o.startGap ? false : true;
  top.push(at(0));
  while (s < L - 1) {
    const mw = lerp(o.mw[0], o.mw[1], s), md = lerp(o.md[0], o.md[1], s);
    const len = merlon ? mw : mw * (o.gap || 1);
    const e = Math.min(L, s + len);
    if (merlon) {
      const a = at(s), b = at(e);
      top.push([a[0], a[1] - md], [b[0], b[1] - lerp(o.md[0], o.md[1], e)], b);
    } else top.push(at(e));
    s = e; merlon = !merlon;
  }
  const bot = [];
  for (let i = base.length - 1; i >= 0; i--) bot.push([base[i][0], base[i][1] + lerp(o.h[0], o.h[1], S[i])]);
  let out = path(kD(top) + ' L' + bot.map(p => kP(...p)).join(' L') + ' Z', o.sw ? kW(o.sw) : undefined);
  if (o.band) {
    const bl = base.map((p, i) => [p[0], p[1] + lerp(o.band[0], o.band[1], S[i])]);
    out += line(kD(bl), 5);
  }
  return out;
}

    s += rect(cx - pw / 2, py, pw, ph + md + 6, 0, kW(6));
    const R = pw / 2 + o.pav[2], rh = o.pav[3];
    s += path(`M${kP(cx - R - 10, py - 12)} Q${kP(cx - R + 2, py + 4)} ${kP(cx - R + 16, py + 2)} L${kP(cx + R - 16, py + 2)} Q${kP(cx + R - 2, py + 4)} ${kP(cx + R + 10, py - 12)} ` +
      `Q${kP(cx + R * 0.62, py - 14)} ${kP(cx + R * 0.38, py - rh)} L${kP(cx - R * 0.38, py - rh)} Q${kP(cx - R * 0.62, py - 14)} ${kP(cx - R - 10, py - 12)} Z`, kW(6));

function kCub(P, t) {

// palm tree: trunk from (x, by) to crown (tx, ty)
function kBandQ(P, w0, w1, cuts) {
  const q = t => { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; };
  const dq = t => { const u = 1 - t; return [2 * u * (P[1][0] - P[0][0]) + 2 * t * (P[2][0] - P[1][0]), 2 * u * (P[1][1] - P[0][1]) + 2 * t * (P[2][1] - P[1][1])]; };
  const at = t => {
    const c = q(t), d = dq(t), L = Math.hypot(d[0], d[1]), w = (w0 + (w1 - w0) * t) / 2, nx = -d[1] / L, ny = d[0] / L;
    return [[c[0] + nx * w, c[1] + ny * w], [c[0] - nx * w, c[1] - ny * w]];
  };
  let s = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i], b = cuts[i + 1], N = 10, Lp = [], Rp = [];
    for (let j = 0; j <= N; j++) { const p = at(a + (b - a) * j / N); Lp.push(p[0]); Rp.push(p[1]); }
    s += path(kD(Lp) + ' L' + Rp.reverse().map(p => kP(...p)).join(' L') + ' Z', kW(6));
  }
  return s;
}
function kPalm(x, by, tx, ty, k = 1, angles = [-165, -125, -55, -15], cuts = [0, 0.5, 1]) {
  let s = kBandQ([[x, by], [x + (tx - x) * 0.15, (by + ty) / 2], [tx, ty]], 40 * k, 28 * k, cuts);
  const L = 100 * k, Wd = 36 * k;
  angles.forEach(a => {
    const flip = Math.cos(a * Math.PI / 180) < -0.01 ? -1 : 1;
    s += g(path(`M0 0 Q${n2(L * 0.45)} ${n2(-Wd)} ${n2(L)} ${n2(Wd * 0.4)} Q${n2(L * 0.5)} ${n2(Wd * 0.5)} 0 0 Z`, kW(6)),
           `translate(${n2(tx)} ${n2(ty)}) rotate(${a}) scale(1 ${flip})`);
  });
  s += circle(tx - 13 * k, ty + 18 * k, 15 * k, kW(6)) + circle(tx + 13 * k, ty + 18 * k, 15 * k, kW(6));
  s += circle(tx, ty, 18 * k, kW(6));
  return s;
}

// 2 ---------------------------------------------------------------- Atomium (Brussels)
function lAtomium(cx, cyc, a, R, phi, beta, groundY) {
  const r3 = Math.sqrt(3), r2 = Math.SQRT2, r6 = Math.sqrt(6);
  const cp = Math.cos(phi), sp = Math.sin(phi), cb = Math.cos(beta), sb = Math.sin(beta);
  // (h, s, t): height along the body diagonal and two horizontal axes
  const hst = p => { const q = p.map(v => v - 0.5); return [(q[0] + q[1] + q[2]) / r3, (q[0] - q[1]) / r2, (q[0] + q[1] - 2 * q[2]) / r6]; };
  const proj = ([h, s1, t]) => {
    const X = s1 * cp - t * sp, D = s1 * sp + t * cp;
    return { x: cx + X * a, y: cyc - (h * cb + D * sb) * a, z: D * cb - h * sb };
  };
  const V = [];
  for (let i = 0; i < 8; i++) V.push(proj(hst([i & 1, (i >> 1) & 1, (i >> 2) & 1])));
  const C = proj([0, 0, 0]);
  const items = [];
  const tubeW = R * 0.26;
  const addTube = (A, B, w = tubeW) => {
    const L = Math.hypot(B.x - A.x, B.y - A.y), ux = (B.x - A.x) / L, uy = (B.y - A.y) / L, z = (A.z + B.z) / 2;
    const ea = z > A.z ? R * 0.9 : R * 0.5, eb = z > B.z ? R * 0.9 : R * 0.5;
    items.push({ z: z - 0.001, s: tube(`M${lP(A.x + ux * ea, A.y + uy * ea)} L${lP(B.x - ux * eb, B.y - uy * eb)}`, w) });
  };
  for (let i = 0; i < 8; i++) for (let b = 0; b < 3; b++) { const j = i ^ (1 << b); if (j > i) addTube(V[i], V[j]); }
  // diagonals to the centre sphere: only the ones on the near side (the far ones hide behind it)
  V.forEach(v => { if (v.z > -0.2) addTube(v, C); });
  // three bipods under the lower spheres
  [1, 2, 4].forEach(i => {
    const p = hst([i & 1, (i >> 1) & 1, (i >> 2) & 1]);
    const rr = Math.hypot(p[1], p[2]), ux = p[1] / rr, uy = p[2] / rr;
    [-1, 1].forEach(k => {
      const f = proj([0, (rr * 1.12) * ux - k * 0.24 * uy, (rr * 1.12) * uy + k * 0.24 * ux]);
      const S = V[i];
      items.push({ z: (S.z + f.z) / 2, s: tube(`M${lP(S.x, S.y)} L${lP(f.x, groundY)}`, R * 0.16) });
    });
  });
  const sphere = (P, top) => {
    let s = circle(P.x, P.y, R);
    if (top) {
      s += path(`M${lP(P.x - R * 0.97, P.y + 4)} Q${lP(P.x, P.y + R * 0.36)} ${lP(P.x + R * 0.97, P.y + 4)} L${lP(P.x + R * 0.9, P.y + R * 0.4)} Q${lP(P.x, P.y + R * 0.72)} ${lP(P.x - R * 0.9, P.y + R * 0.4)} Z`, lW(5));
      for (let k = -2; k <= 2; k++) s += rect(P.x + k * R * 0.34 - 5, P.y + R * 0.3 + Math.abs(k) * -2 + 3, 10, 12, 3, lInk);

    return s;
  };
  V.forEach((v, i) => items.push({ z: v.z, s: sphere(v, i === 7) }));
  items.push({ z: C.z, s: sphere(C, false) });
  return items.sort((p, q) => p.z - q.z).map(it => it.s).join('');
}

// four lattice sails around the hub (hx, hy): framed rectangles split by crossbars, two stocks, the hub
function lSails(hx, hy, rot, r0, r1, sw, cells, stockW = 10) {
  let s = '';
  for (let i = 0; i < 4; i++) {
    let t = rect(r0, 0, r1 - r0, sw, 2, lW(6));
    for (let c = 1; c < cells; c++) { const x = r0 + (r1 - r0) * c / cells; t += line(`M${n2(x)} 0 V${n2(sw)}`, 5); }
    s += g(t, `translate(${n2(hx)} ${n2(hy)}) rotate(${n2(rot + i * 90)})`);
  }
  [0, 90].forEach(a => { s += g(rect(-r1 - 6, -stockW / 2, 2 * r1 + 12, stockW, stockW / 2, lInk), `translate(${n2(hx)} ${n2(hy)}) rotate(${n2(rot + a)})`); });
  return s + circle(hx, hy, stockW + 5, lW(6));
}
// thatched cap (bonnet) sitting on y = top
function lCap(cx, top, w, h) {
  return path(`M${lP(cx - w / 2, top + 4)} Q${lP(cx - w / 2 + 2, top - h * 0.9)} ${lP(cx, top - h)} Q${lP(cx + w / 2 - 2, top - h * 0.9)} ${lP(cx + w / 2, top + 4)} Z`) +

}
// round brick mill: tapered tower, door, windows, thatched cap, sails
function lBrickMill(cx, by, wb, wt, H, o) {
  const top = by - H;
  let s = '';
  s += path(`M${lP(cx - wb / 2, by)} Q${lP(cx - wb / 2 + (wb - wt) * 0.18, by - H * 0.55)} ${lP(cx - wt / 2, top)} L${lP(cx + wt / 2, top)} Q${lP(cx + wb / 2 - (wb - wt) * 0.18, by - H * 0.55)} ${lP(cx + wb / 2, by)} Z`);
  // brick courses (decorative, do not split)
  [[-0.28, 0.3], [0.2, 0.42], [-0.1, 0.62], [0.26, 0.78], [-0.3, 0.86]].forEach(([fx, fy]) => {
    const y = top + H * fy, w = wt + (wb - wt) * fy;
    s += line(`M${lP(cx + fx * w - 12, y)} H${n2(cx + fx * w + 12)}`, 4);
  });
  const dw = wb * 0.24, dh = H * 0.24;
  s += path(`M${lP(cx - dw / 2, by)} V${n2(by - dh + dw / 2)} A${n2(dw / 2)} ${n2(dw / 2)} 0 0 1 ${lP(cx + dw / 2, by - dh + dw / 2)} V${n2(by)} Z`, lW(6));
  s += line(`M${lP(cx, by - dh + 6)} V${n2(by - 2)}`, 4);
  (o.win || []).forEach(([x, y, w, h]) => { s += path(`M${lP(cx + x - w / 2, y + h)} V${n2(y + w / 2)} A${n2(w / 2)} ${n2(w / 2)} 0 0 1 ${lP(cx + x + w / 2, y + w / 2)} V${n2(y + h)} Z`, lW(5)); });
  s += lCap(cx, top, wt + 26, o.capH);
  s += lSails(cx, top - o.capH * 0.42, o.rot, o.r0, o.r1, o.sw, o.cells, o.stockW);
  return s;
}
// thatched octagonal ground-sailer on a brick base
function lThatchMill(cx, by, wb, wt, H, o) {
  const top = by - H, bh = o.baseH;

// Svet: famous landmarks drawn faithfully as postcard views
// (Prater giant wheel, Niagara Falls, Grand Canyon, Petra Treasury, Uluru).
(() => {
const mInk = { fill: INK, stroke: 'none' };
const mW = w => ({ 'stroke-width': w });
const mP = (x, y) => `${n2(x)} ${n2(y)}`;
const mD = pts => 'M' + pts.map(p => mP(...p)).join(' L');
const mRad = d => d * Math.PI / 180;
function mQ(P, t) { const u = 1 - t; return [u * u * P[0][0] + 2 * u * t * P[1][0] + t * t * P[2][0], u * u * P[0][1] + 2 * u * t * P[1][1] + t * t * P[2][1]]; }
function mQpts(P, n = 40) { const o = []; for (let i = 0; i <= n; i++) o.push(mQ(P, i / n)); return o; }
// Catmull-Rom spline through points, sampled densely
function mSpline(pts, n = 14) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
// y of a polyline at x
function mYat(sp, x) {
  for (let i = 0; i < sp.length - 1; i++) {
    const a = sp[i], b = sp[i + 1];
    if ((a[0] - x) * (b[0] - x) <= 0 && a[0] !== b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  return x < sp[0][0] ? sp[0][1] : sp[sp.length - 1][1];
}
// layer whose top edge is the polyline pts, closed down to the bottom of the page
function mLayer(pts, a) { return path(mD(pts) + ` L${mP(pts[pts.length - 1][0], 820)} L${mP(pts[0][0], 820)} Z`, a); }
// horizontal stratum line at height Y, drawn only where the layer (top edge pts) lies above Y
function mStrata(pts, Y, sw = 5) {
  let s = '', start = null;
  const inside = p => p[1] < Y;
  if (inside(pts[0])) start = [pts[0][0], Y];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (inside(a) !== inside(b)) {
      const x = a[0] + (b[0] - a[0]) * (Y - a[1]) / (b[1] - a[1]);
      if (start === null) start = [x, Y];
      else { s += line(`M${mP(...start)} L${mP(x, Y)}`, sw); start = null; }
    }
  }
  if (start !== null) s += line(`M${mP(...start)} L${mP(pts[pts.length - 1][0], Y)}`, sw);
  return s;
}
function mBird(x, y, k = 1) {
  return line(`M${mP(x - 20 * k, y)} Q${mP(x - 10 * k, y - 12 * k)} ${mP(x, y)} Q${mP(x + 10 * k, y - 12 * k)} ${mP(x + 20 * k, y)}`, 5);
}
function mPuff(circles, sw = 6) { return union(circles.map(c => ({ c })), sw); }
// round park tree: trunk + three-lobed crown; (x, by) = foot of the trunk
function mTree(x, by, r) {
  return path(`M${mP(x - r * 0.18, by)} L${mP(x - r * 0.12, by - r * 1.1)} L${mP(x + r * 0.12, by - r * 1.1)} L${mP(x + r * 0.2, by)} Z`, mW(6)) +
    mPuff([[x - r * 0.55, by - r * 1.25, r * 0.6], [x + r * 0.55, by - r * 1.2, r * 0.62], [x, by - r * 1.7, r * 0.75]]);
}

// 1 ---------------------------------------------------------------- Wiener Riesenrad (Prater)
// red wagon cabin straddling the rim; (x, y) = its centre
function mCabin(x, y) {
  let s = path(`M${mP(x - 28, y + 22)} V${n2(y - 6)} H${n2(x - 34)} L${mP(x - 21, y - 20)} H${n2(x + 21)} L${mP(x + 34, y - 6)} H${n2(x + 28)} V${n2(y + 22)} Z`, mW(6));
  [-16, 0, 16].forEach(dx => { s += rect(x + dx - 5.5, y - 1, 11, 12, 2, mInk); });
  return s + circle(x, y - 13, 3.5, mInk);
}
// little carousel horse, one outline; (x, y) = middle of the body, facing right
function mHorse(x, y, f = 1) {
  const X = dx => x + dx * f;
  return path(`M${mP(X(-20), y - 3)} Q${mP(X(-18), y - 11)} ${mP(X(-6), y - 11)} L${mP(X(8), y - 11)} L${mP(X(14), y - 25)} Q${mP(X(19), y - 32)} ${mP(X(27), y - 27)} L${mP(X(33), y - 18)} ` +
    `Q${mP(X(31), y - 13)} ${mP(X(25), y - 16)} L${mP(X(21), y - 8)} Q${mP(X(22), y + 4)} ${mP(X(15), y + 8)} L${mP(X(22), y + 19)} L${mP(X(15), y + 22)} L${mP(X(6), y + 9)} ` +
    `L${mP(X(-8), y + 9)} L${mP(X(-15), y + 22)} L${mP(X(-22), y + 19)} L${mP(X(-16), y + 6)} Q${mP(X(-28), y + 6)} ${mP(X(-20), y - 3)} Z`, mW(5));
}
function mCarousel(cx, by) {
  let s = '';
  s += rect(cx - 82, by - 22, 164, 22, 10);
  s += rect(cx - 80, by - 106, 160, 86, 0, mW(6));
  s += line(`M${cx - 40} ${by - 106} V${by - 22} M${cx + 40} ${by - 106} V${by - 22}`, 5);
  s += g(mHorse(0, 0, 1), `translate(${cx - 40} ${by - 58}) scale(0.85)`) + g(mHorse(0, 0, -1), `translate(${cx + 40} ${by - 60}) scale(0.85)`);
  // scalloped valance + cone roof + knob
  let v = `M${mP(cx - 86, by - 118)} H${n2(cx + 86)} V${n2(by - 104)}`;
  for (let i = 0; i < 6; i++) { const xa = cx + 86 - i * 172 / 6, xb = xa - 172 / 6; v += ` Q${mP((xa + xb) / 2, by - 86)} ${mP(xb, by - 104)}`; }
  s += path(v + ' Z', mW(6));
  s += path(`M${mP(cx - 92, by - 116)} L${mP(cx, by - 176)} L${mP(cx + 92, by - 116)} Z`);
  s += circle(cx, by - 184, 10, mW(5));
  return s;
}
SCENES.push({
  id: 'prater', title: 'Obrie koleso Prater', cat: 'svet',
  svg: () => {
    let s = '';
    const cx = 400, cy = 314, RO = 262, RI = 226, G = 676;
    s += mBird(110, 86) + mBird(150, 66, 0.8) + mBird(700, 112, 0.9);
    s += path(`M12 ${G} H788 V788 H12 Z`);
    // the wheel: lattice rim (zigzag truss between two rings), spokes to the inner nodes
    const ang = i => mRad(90 + 24 * i);
    const at = (a, r) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    s += circle(cx, cy, RO) + circle(cx, cy, RI);
    const z = [];
    // the truss zigzag stops just short of both rings, so each rim segment stays one area
    for (let i = 0; i <= 15; i++) { z.push(at(ang(i), RI)); if (i < 15) z.push(at(ang(i) + mRad(12), RO - 9)); }
    s += line(mD(z), 5);
    for (let i = 0; i < 15; i++) s += line(`M${mP(...at(ang(i), 30))} L${mP(...at(ang(i), RI))}`, 5);
    // steel pylons: two lattice legs from the axle down to the ground, along two spokes
    [66, 114].forEach(d => {
      const a = mRad(d), nx = -Math.sin(a), ny = Math.cos(a);
      const r1 = (G + 10 - cy) / Math.sin(a), w = r => 10 + 8 * r / r1;
      const E = (r, k) => { const p = at(a, r); return [p[0] + nx * w(r) * k, p[1] + ny * w(r) * k]; };
      s += poly([E(24, 1), E(r1, 1), E(r1, -1), E(24, -1)], mW(6));
      [150].forEach(r => { s += line(`M${mP(...E(r, 1))} L${mP(...E(r, -1))}`, 5); });
    });
    s += circle(cx, cy, 36) + circle(cx, cy, 15, mW(6));
    // boarding station between the legs
    s += rect(300, 642, 200, 36, 3) + rect(290, 632, 220, 16, 6, mW(6));
    s += rect(330, 652, 26, 26, 2, mInk) + rect(444, 652, 26, 26, 2, mInk);
    // 15 red cabins
    for (let i = 0; i < 15; i++) s += mCabin(...at(ang(i), (RO + RI) / 2));
    // park trees and the carousel
    s += mTree(70, 744, 56) + mTree(178, 760, 44);
    s += mCarousel(690, 770);
    return s;
  }
});

// 2 ---------------------------------------------------------------- Niagara Falls (Horseshoe Falls seen from Table Rock)
function mBoat(x, y, heads = true) {
  // double-deck tour boat heading left; (x, y) = waterline middle
  let s = '';
  if (heads) [-70, -40, -10, 20].forEach(dx => { s += circle(x + dx, y - 86, 11, mW(5)); });
  s += rect(x - 86, y - 76, 150, 26, 4, mW(6));
  s += rect(x - 96, y - 52, 174, 36, 4);
  [-80, -50, -20, 10, 40].forEach(dx => { s += rect(x + dx, y - 44, 20, 18, 3, mInk); });
  s += path(`M${mP(x - 128, y - 22)} L${mP(x + 112, y - 22)} L${mP(x + 98, y + 14)} L${mP(x - 100, y + 14)} Z`);
  s += line(`M${mP(x - 116, y - 4)} L${mP(x + 106, y - 4)}`, 5);
  return s;
}
SCENES.push({
  id: 'niagara', title: 'Niagarské vodopády', cat: 'svet',
  svg: () => {
    let s = '';
    s += mBird(200, 80) + mBird(240, 62, 0.8) + mBird(470, 110, 0.7);
    // far shore on the horizon: trees on the left, the city with its tower small on the right
    s += rect(640, 158, 30, 36, 3, mW(6)) + rect(748, 150, 34, 44, 3, mW(6));
    s += line('M712 88 V72', 5) + rect(707, 112, 12, 82, 3, mW(6)) + rect(694, 96, 38, 16, 6, mW(5));
    s += path('M-10 196 Q300 186 600 192 Q700 194 810 188 V820 H-10 Z');
    s += mPuff([[30, 186, 16], [62, 178, 20], [98, 184, 16], [134, 178, 18], [170, 184, 15], [230, 182, 15], [262, 178, 18]], 5);
    // smooth upper river racing to the brink
    s += path('M-10 212 Q400 204 810 212 V820 H-10 Z');
    [[120, 236], [260, 232], [400, 228], [520, 232], [190, 262], [340, 258], [480, 256], [600, 254], [90, 290], [260, 292], [420, 290]].forEach(([x, y]) => {
      s += line(`M${mP(x - 18, y)} Q${mP(x, y + 8)} ${mP(x + 18, y)}`, 4.5);
    });
    // the churning river far below
    s += path('M-10 420 H810 V820 H-10 Z');
    // Goat Island at the far end of the horseshoe: trees on top, rock wall down to the water
    s += path('M584 338 Q618 312 680 306 L820 300 V500 Q700 508 600 494 Q592 420 584 338 Z');
    s += line('M590 372 Q700 352 812 356', 5);
    s += mPuff([[640, 316, 22], [690, 300, 28], [744, 296, 26], [794, 300, 28]], 6);
    // the brink sweeps from the near left away to the right; the curtain shortens with distance
    const BR = [[-10, 292], [250, 372], [602, 332]];
    const H = t => 430 * Math.pow(1 - t, 1.25) + 124 * t;
    const N = 48, top = [], bot = [];
    for (let i = 0; i <= N; i++) { const t = i / N, p = mQ(BR, t); top.push(p); bot.push([p[0], p[1] + H(t)]); }
    s += path(mD(top) + ' L' + bot.reverse().map(p => mP(...p)).join(' L') + ' Z');
    for (let k = 1; k < 15; k++) {
      const t = Math.pow(k / 15, 0.62), p = mQ(BR, t), h = H(t);
      s += line(`M${mP(...p)} C${mP(p[0] - 16 * (1 - t), p[1] + h * 0.25)} ${mP(p[0] + 4, p[1] + h * 0.6)} ${mP(p[0] + 6 * (1 - t), p[1] + h + 6)}`, 5);
    }
    // churning water lines
    s += line('M560 560 Q576 550 592 560', 4.5) + line('M690 560 Q706 550 722 560', 4.5) + line('M740 640 Q756 630 772 640', 4.5) + line('M520 790 Q536 780 552 790', 4.5) + line('M720 790 Q736 780 752 790', 4.5);
    // huge cloud of mist billowing up along the foot of the curtain
    const MC = [[-10, 566], [50, 548], [112, 536], [176, 520], [240, 500], [304, 482], [366, 466], [428, 452], [486, 444], [540, 440], [584, 448], [612, 470],
      [604, 516], [580, 568], [556, 624], [536, 684], [520, 744], [512, 820]];
    const rr = (x, i) => 42 - 14 * Math.min(1, Math.max(0, x) / 600) + 5 * Math.sin(i * 2.3);
    const bill = MC.map(([x, y], i) => ({ c: [x, y, rr(x, i)] }));
    MC.slice(1).forEach(([x, y], i) => { const m = [(x + MC[i][0]) / 2, (y + MC[i][1]) / 2 + 6]; bill.push({ c: [m[0], m[1], rr(m[0], i + 0.5) * 0.8] }); });
    bill.push({ c: [404, 436, 32] }, { c: [392, 406, 26] }, { c: [412, 386, 20] }, { c: [250, 470, 30] }, { c: [232, 444, 22] });
    bill.push({ d: mD(MC) + ' L-10 820 Z' });
    s += union(bill);
    // rainbow in the mist, feet hidden in billows
    s += tube('M150 724 A160 160 0 0 1 470 724', 48);
    s += line('M166 724 A144 144 0 0 1 454 724', 5) + line('M134 724 A176 176 0 0 1 486 724', 5);
    s += mPuff([[150, 718, 40], [114, 738, 30], [186, 742, 28]]) + mPuff([[470, 716, 38], [436, 736, 28], [504, 738, 28]]);
    // the double-deck tour boat in the churning water
    s += g(mBoat(0, 0, false), 'translate(668 724) scale(0.7)');
    // Table Rock viewpoint: stone parapet with a coping running towards us
    const cy = x => 682 + (x + 10) * 0.42;
    s += path(`M-10 ${n2(cy(-10))} L380 ${n2(cy(380))} L380 830 L-10 830 Z`);
    s += path(`M-10 ${n2(cy(-10) - 22)} L384 ${n2(cy(384) - 22)} L384 ${n2(cy(384) + 4)} L-10 ${n2(cy(-10) + 4)} Z`, mW(6));
    [70, 160, 250, 340].forEach(x => { s += line(`M${mP(x, cy(x) + 4)} L${mP(x, 820)}`, 5); });
    return s;
  }
});

// 3 ---------------------------------------------------------------- Grand Canyon (South Rim view)
// river ribbon along a smooth centre line, width growing from w0 (far) to w1 (near)
function mRiver(pts, w0, w1) {
  const c = mSpline(pts, 10), Lp = [], Rp = [];
  c.forEach((p, i) => {
    const q = c[Math.min(c.length - 1, i + 1)], o = c[Math.max(0, i - 1)];
    const dx = q[0] - o[0], dy = q[1] - o[1], l = Math.hypot(dx, dy) || 1, w = (w0 + (w1 - w0) * i / (c.length - 1)) / 2;
    Lp.push([p[0] - dy / l * w, p[1] + dx / l * w]); Rp.push([p[0] + dy / l * w, p[1] - dx / l * w]);
  });
  return path(mD(Lp) + ' L' + Rp.reverse().map(p => mP(...p)).join(' L') + ' Z');
}
function mPine(x, by, h) {
  const w = h * 0.36;
  return rect(x - 8, by - h * 0.22, 16, h * 0.22 + 2, 2, mW(5)) +
    path(`M${mP(x, by - h)} L${mP(x + w * 0.6, by - h * 0.62)} L${mP(x + w * 0.35, by - h * 0.62)} L${mP(x + w, by - h * 0.2)} L${mP(x - w, by - h * 0.2)} L${mP(x - w * 0.35, by - h * 0.62)} L${mP(x - w * 0.6, by - h * 0.62)} Z`, mW(6));
}
function mCondor(x, y, k = 1) {
  let s = '';
  const X = (dx, f = 1) => x + dx * f * k, Y = dy => y + dy * k;
  s += path(`M${mP(X(-14), Y(20))} L${mP(X(-20), Y(44))} Q${mP(X(0), Y(52))} ${mP(X(20), Y(44))} L${mP(X(14), Y(20))} Z`, mW(6));
  [-1, 1].forEach(f => {
    s += path(`M${mP(X(10, f), Y(-10))} Q${mP(X(60, f), Y(-24))} ${mP(X(116, f), Y(-18))} L${mP(X(156, f), Y(-16))} L${mP(X(140, f), Y(-7))} L${mP(X(158, f), Y(-2))} ` +
      `L${mP(X(140, f), Y(4))} L${mP(X(154, f), Y(12))} L${mP(X(132, f), Y(12))} L${mP(X(140, f), Y(22))} L${mP(X(112, f), Y(18))} Q${mP(X(60, f), Y(28))} ${mP(X(10, f), Y(18))} Z`);
    s += line(`M${mP(X(14, f), Y(2))} Q${mP(X(64, f), Y(-4))} ${mP(X(114, f), Y(-18))}`, 5);
  });
  s += ellipse(x, Y(8), 20 * k, 30 * k);
  s += ellipse(x, Y(-20), 17 * k, 10 * k, mW(6));
  s += ellipse(x, Y(-34), 10 * k, 13 * k, mW(6));
  return s;
}
// free-standing butte / temple with an irregular stepped profile.
// tiers from the bottom up: [slope foot half-width, cliff foot half-width, slope height, cliff top half-width, cliff height]
// every slope and every cliff band is its own area; strata lines sit on the ledges and cliff feet.
function mButte(cx, by, tiers, seed = 1) {
  const J = k => Math.sin(seed * 12.9898 + k * 78.233) * 8;
  const L = [], R = [], cuts = [];
  let y = by, k = 0;
  tiers.forEach(([a, b, h, c, ch], i) => {
    const aL = a + J(k++), aR = a + J(k++), bL = b + J(k++), bR = b + J(k++), cL = c + J(k++), cR = c + J(k++);
    if (i > 0) cuts.push([[cx - aL, y], [cx + aR, y]]);
    L.push([cx - aL, y], [cx - aL + (aL - bL) * 0.62, y - h * 0.38]);
    R.push([cx + aR, y], [cx + aR - (aR - bR) * 0.62, y - h * 0.38]);
    y -= h;
    L.push([cx - bL, y]); R.push([cx + bR, y]);
    cuts.push([[cx - bL, y], [cx + bR, y]]);
    L.push([cx - (bL + cL) / 2 + J(k++) * 0.5, y - ch * 0.55]); R.push([cx + (bR + cR) / 2 + J(k++) * 0.5, y - ch * 0.45]);
    y -= ch;
    L.push([cx - cL, y + J(k++) * 0.3]); R.push([cx + cR, y + J(k++) * 0.3]);
  });
  L.push([cx + J(k++), y - 5]);
  let s = path(mD(L.concat(R.reverse())) + ' Z');
  cuts.forEach(([p, q]) => { s += line(`M${mP(...p)} Q${mP((p[0] + q[0]) / 2, (p[1] + q[1]) / 2 + 4)} ${mP(...q)}`, 5); });
  return s;
}
SCENES.push({
  id: 'grand-canyon', title: 'Grand Canyon', cat: 'svet',
  svg: () => {
    let s = '';
    // big sky with a soaring condor
    s += cloud(620, 104, 170, 50) + mCondor(250, 112, 1.1) + mBird(470, 76, 0.8);
    // North Rim: long flat plateau far away, two rock bands
    const N = [[-10, 238], [120, 234], [260, 238], [400, 232], [540, 236], [680, 231], [810, 235]];
    s += mLayer(N) + line(mD(N.map(([x, y]) => [x, y + 13])), 5) + line(mD(N.map(([x, y]) => [x, y + 28])), 5);
    // far row of low buttes
    const F = [[-10, 320], [40, 316], [52, 298], [70, 292], [76, 274], [130, 272], [136, 290], [150, 296], [164, 316], [240, 322], [300, 314], [310, 296],
      [326, 290], [332, 272], [420, 270], [428, 288], [446, 294], [458, 316], [540, 324], [580, 318], [592, 300], [606, 294], [612, 272], [680, 270],
      [688, 292], [702, 298], [716, 318], [810, 322]];
    s += mLayer(F) + mStrata(F, 300);
    // ridge behind the temples
    const M = [[-10, 394], [80, 390], [100, 374], [160, 370], [176, 388], [260, 396], [520, 398], [600, 392], [614, 376], [680, 372], [692, 390], [810, 394]];
    s += mLayer(M) + mStrata(M, 408);
    // middle temples: a small butte, the spire temple, the broad mesa
    s += mButte(420, 482, [[84, 52, 24, 48, 28]], 3);
    s += mButte(246, 484, [[156, 100, 34, 96, 30], [90, 60, 30, 56, 34], [46, 30, 24, 26, 40]], 1);
    s += mButte(588, 490, [[196, 136, 32, 130, 34], [120, 94, 28, 88, 36]], 2);
    // inner gorge with a glimpse of the Colorado River deep below
    s += mLayer([[-10, 470], [200, 464], [380, 474], [560, 468], [810, 474]]);
    s += line('M-10 540 Q400 530 810 544', 5);
    s += mRiver([[456, 486], [474, 512], [446, 548], [470, 590], [444, 640]], 10, 26);
    // near promontories stepping down into the gorge
    const Ln = [[-10, 496], [50, 494], [62, 516], [120, 522], [132, 552], [196, 560], [208, 592], [276, 602], [290, 642], [330, 652], [342, 700], [350, 820]];
    s += mLayer(Ln);
    [544, 582, 624].forEach(y => { s += mStrata(Ln, y); });
    const R = [[810, 430], [770, 428], [758, 452], [706, 458], [694, 488], [642, 494], [630, 526], [584, 532], [572, 566], [528, 574], [514, 606], [480, 614],
      [470, 660], [466, 820]];
    s += mLayer(R);
    [448, 476, 512, 552, 594].forEach(y => { s += mStrata(R, y); });
    // the South Rim viewpoint: rocky ledge, short stone wall, pine
    const LD = [[-10, 650], [80, 642], [180, 658], [300, 680], [420, 700], [560, 704], [700, 694], [810, 690]];
    s += mLayer(LD);

function nBlades(x0, x1, base, n, hmin, hmax, y1 = 788, seed = 3, hf) {
  let r = seed;

// stripe on an ellipse outline at parameter angle t, pointing inward

function nBez(p0, p1, p2, p3, t) {

function nWaveD(x0, x1, y, amp, waves, phase = 0, slope = 0) {
  let d = '';

    const x = x0 + (x1 - x0) * i / N, yy = y + slope * i / N + amp * Math.sin(phase + i / N * waves * 2 * Math.PI);

// Returns { d: path data (for union), at(f, side) -> [x, y, inward angle] on its outline }.
function nLimb(pts, ws, n = 10) {
  const C = [], W = [];

      C.push([f(0), f(1)]); W.push(ws[i] + (ws[i + 1] - ws[i]) * t);

// ---------- storage: every picture is a version ("izbicka~2"); meta has the thumbnail, paint has the colours ----------
const DB = (() => {
  let p = null;
  function open() {
    if (!p) p = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(DB_NAME, 2); } catch (e) { rej(e); return; }
      r.onupgradeneeded = e => {
        const db = r.result, tx = r.transaction;
        if (!db.objectStoreNames.contains('art')) db.createObjectStore('art');
        if (e.oldVersion < 2) {
          const meta = db.createObjectStore('meta'), paint = db.createObjectStore('paint');
          // Migration from the first app: each painted picture becomes version 1 of its scene.
          // The old store 'art' stays untouched as a safety copy.
          const cur = tx.objectStore('art').openCursor();
          cur.onsuccess = () => {
            const c = cur.result; if (!c) return;
            const scene = String(c.key), v = c.value || {};
            if (v.paint) {
              const vid = scene + '~1';
              meta.put({ vid, scene, n: 1, t: v.t || 0, thumb: v.thumb || '', done: false, pct: 0 }, vid);
              paint.put({ paint: v.paint, stk: [] }, vid);
            }
            c.continue();
          };
        }
      };
      r.onsuccess = () => { const db = r.result; db.onversionchange = () => db.close(); res(db); };
      r.onerror = () => rej(r.error);

  }
  function tx(stores, mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction(stores, mode);
      const req = fn(t);
      t.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
      t.onerror = t.onabort = () => rej(t.error);
    }));
  }
  return {
    metas: () => tx(['meta'], 'readonly', t => t.objectStore('meta').getAll()).catch(() => []),
    paint: vid => tx(['paint'], 'readonly', t => t.objectStore('paint').get(vid)).catch(() => null),
    save: (meta, rec) => tx(['meta', 'paint'], 'readwrite', t => { t.objectStore('meta').put(meta, meta.vid); if (rec) t.objectStore('paint').put(rec, meta.vid); }),
    del: vid => tx(['meta', 'paint'], 'readwrite', t => { t.objectStore('meta').delete(vid); t.objectStore('paint').delete(vid); }).catch(() => {})
  };

function celebrate() {

  const c = $('#fx'), x = c.getContext('2d'), r = Math.min(window.devicePixelRatio || 1, 2);
  c.width = innerWidth * r; c.height = innerHeight * r; c.hidden = false;
  const cols = ['#ff7fa8', '#ffcf3d', '#7cc8f5', '#93d67a', '#bba2f5', '#ff9a4d'];
  const P = Array.from({ length: 160 }, () => ({
    x: Math.random() * c.width, y: -Math.random() * c.height * 0.6, vx: (Math.random() - 0.5) * 4 * r, vy: (2 + Math.random() * 4) * r,
    s: (6 + Math.random() * 8) * r, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, col: cols[Math.floor(Math.random() * cols.length)], star: Math.random() < 0.3

}

    navigator.serviceWorker.register(ROOT + 'sw.js', { scope: ROOT || './' }).then(() => navigator.serviceWorker.ready).then(reg => {
      const el = document.getElementById('offline'); if (el) el.textContent = TX.offlineOk;
      if (navigator.onLine && reg.active) reg.active.postMessage('check-cache');   // refill anything another app on this domain removed
    }).catch(() => {});
  }
}
boot();
window.__omalTest = () => ({ S, METAS, act });   // read-only peek for automated tests
})();
